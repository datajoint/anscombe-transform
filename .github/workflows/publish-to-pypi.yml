name: Publish to PyPI

# Pull requests and pushes to main build the package. A release is an annotated
# tag vX.Y.Z on main whose message is the release notes: pushing it checks the
# tag, runs the Test workflow, publishes the package built at the tag (hatch-vcs
# takes the version from the tag), and creates the GitHub release with the
# tag's message as its notes. A manual run only builds.
#
# PyPI trusted publishing is bound to this file's name and to the pypi
# environment, so neither can be renamed without updating PyPI.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a build in progress; a release is never cancelled.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  dist:
    name: Distribution build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Builds the sdist and wheel, checks them with twine, and uploads them as
      # the "Packages" artifact.
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  check:
    name: Check the release tag
    # Only a pushed tag publishes; a manual run on a tag does not.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: check
        run: .github/scripts/check_release_tag.sh "$GITHUB_REF_NAME" main

  test:
    name: Test
    needs: [check]
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml

  publish:
    needs: [dist, check, test]
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anscombe_transform
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Check the built version
        run: |
          version="${TAG#v}"
          for file in dist/*; do
            case "$(basename "$file")" in
              "anscombe_transform-$version-"*.whl | "anscombe_transform-$version.tar.gz") ;;
              *) echo "::error::$file does not carry version $version"; exit 1 ;;
            esac
          done

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: [publish]
    name: Create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the tag object
        # actions/checkout can store an annotated tag as a lightweight ref.
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "anscombe-transform ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
