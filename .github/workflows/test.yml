name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # The publish workflow runs this as the test gate of a release.
  workflow_call:

concurrency:
  # "Test" rather than github.workflow, which in a run called from the publish
  # workflow is that workflow's name: sharing the caller's group deadlocks.
  group: Test-${{ github.ref }}
  # A release is never cancelled.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / np${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python: ["3.11", "3.12", "3.13"]
        numpy: ["1.26", "2.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests
        run: hatch run test.py${{ matrix.python }}-${{ matrix.numpy }}:pytest tests/

  test-upstream:
    name: Test upstream dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests with upstream dependencies
        run: hatch run upstream:pytest tests/

  test-complete:
    name: All tests passed
    if: always()
    needs: [test, test-upstream]
    runs-on: ubuntu-latest
    steps:
      - name: Check test matrix status
        if: needs.test.result != 'success'
        run: exit 1
      - name: Check upstream test status
        if: needs.test-upstream.result != 'success'
        run: exit 1
